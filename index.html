<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal Ujian CBT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Aplikasi Portal Ujian Computer Based Test (CBT) Daring SMA dengan Pengawasan Anti-Curang, Status Sesi & Rekapitulasi Nilai." />
    <link rel="manifest" href="/manifest.json" />
    <title>Portal Ujian CBT - Sistem Asesmen Daring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
